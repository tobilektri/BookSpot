name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        db: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bookspot_test
          MARIADB_USER: bookspot
          MARIADB_PASSWORD: bookspot
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mbstring, curl, gmp
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: find backend public/api tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: vendor/bin/phpunit
        env:
          TEST_DB_DSN: ${{ matrix.db == 'mariadb' && 'mysql:host=127.0.0.1;port=3306;dbname=bookspot_test;charset=utf8mb4' || '' }}
          TEST_DB_USER: bookspot
          TEST_DB_PASS: bookspot

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            public/index.html
            public/sw.js
            public/manifest.webmanifest
            public/favicon.svg
            public/assets
            public/icons

  # Ready-to-upload bundle for shared hosting (FTP): includes vendor/ and the built frontend.
  bundle:
    needs: [php, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public
      - name: Create bundle
        run: |
          mkdir -p dist/bookspot
          cp -r backend public vendor var .htaccess .env.example composer.json README.md LICENSE dist/bookspot/
          rm -rf dist/bookspot/var/*.sqlite dist/bookspot/var/sessions
          cd dist && zip -qr bookspot.zip bookspot
      - uses: actions/upload-artifact@v4
        with:
          name: bookspot-bundle
          path: dist/bookspot.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bookspot.zip

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        db: [sqlite, mariadb]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mbstring, curl, gmp
          coverage: none
      - name: Start MariaDB
        if: matrix.db == 'mariadb'
        # Official image, tried from several mirrors: anonymous pulls on shared runners
        # regularly fail on a single registry (Docker Hub: 429, ECR Public: data limit).
        run: |
          for image in public.ecr.aws/docker/library/mariadb:11.4 mirror.gcr.io/library/mariadb:11.4 docker.io/library/mariadb:11.4; do
            for attempt in 1 2; do
              docker pull -q "$image" && break 2
              sleep 5
            done
          done
          docker run -d --name mariadb -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=bookspot_test \
            -e MARIADB_USER=bookspot -e MARIADB_PASSWORD=bookspot "$image"
          for i in $(seq 1 60); do
            docker exec mariadb healthcheck.sh --connect --innodb_initialized && exit 0
            sleep 2
          done
          docker logs mariadb
          exit 1
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: find backend public/api tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: vendor/bin/phpunit
        env:
          TEST_DB_DSN: ${{ matrix.db == 'mariadb' && 'mysql:host=127.0.0.1;port=3306;dbname=bookspot_test;charset=utf8mb4' || '' }}
          TEST_DB_USER: bookspot
          TEST_DB_PASS: bookspot

  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: |
            public/index.html
            public/sw.js
            public/manifest.webmanifest
            public/favicon.svg
            public/assets
            public/app-icons

  # Ready-to-upload bundle for shared hosting (FTP): includes vendor/ and the built frontend.
  bundle:
    needs: [php, frontend]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public
      - name: Create bundle
        run: |
          mkdir -p dist/bookspot
          cp -r backend public vendor var .htaccess .env.example composer.json README.md LICENSE dist/bookspot/
          rm -rf dist/bookspot/var/*.sqlite dist/bookspot/var/sessions
          cd dist && zip -qr bookspot.zip bookspot
      - uses: actions/upload-artifact@v7
        with:
          name: bookspot-bundle
          path: dist/bookspot.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/bookspot.zip

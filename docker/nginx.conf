server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.html;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API front controller: /api/v1/… -> api/index.php (backend/src/Http/Kernel.php)
    location ^~ /api/v1 {
        rewrite ^/api/(v1(?:/.*)?)$ /api/index.php?_route=/$1 last;
        return 404;
    }
    # PHP API endpoints only (index.php + deprecated *.php shims) – nothing else is executed.
    location ~ ^/api/[a-z_]+\.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    # Hashed bundles never change; the app shell and service worker must revalidate.
    location /assets/ {
        expires 1y;
        access_log off;
    }
    location = /sw.js { expires -1; }
    location = /index.html { expires -1; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

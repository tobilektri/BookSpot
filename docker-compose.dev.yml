# Development override: live-mounts the source and runs the Vite dev server.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   -> PHP/nginx on http://localhost:8080, Vite (hot reload) on http://localhost:5173
services:
  app:
    environment:
      APP_ENV: development
      ALLOW_REGISTRATION: "true"
    volumes:
      - .:/var/www/html
      - app_var:/var/www/html/var
  web:
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  vite:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npx vite --host 0.0.0.0"
    environment:
      BOOKSPOT_API: http://web:80
    ports:
      - "5173:5173"
    volumes:
      - .:/app
